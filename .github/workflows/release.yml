# Runs ONLY on v* tags: unit tests → AppImage (Linux) + .dmg (macOS) + .zip (Windows) → GitHub release.
# "Run workflow" (manual) rebuilds an existing tag and re-attaches its packages.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  build:
    strategy:
      # A failing platform shouldn't keep the other's package from being released.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
            package: QuickRecord-*-x86_64.AppImage
          - os: macos-latest # Apple Silicon
            arch: macos-arm64
            package: QuickRecord-*-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      # linuxdeploy's appimage plugin runs appimagetool, which needs FUSE unless extracted.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # `just package` derives the version from `git describe --tags`.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      # .sdk holds Qt (+ linuxdeploy and the bundled ffmpeg/gifski on Linux).
      - uses: actions/cache@v4
        with:
          path: |
            .conan2
            .venv
            .sdk
          key: quickrecord-${{ matrix.arch }}-${{ hashFiles('flake.lock', 'conanfile.py') }}
          restore-keys: quickrecord-${{ matrix.arch }}-

      - name: Tests
        run: nix develop --command just tests ${{ matrix.arch }} Release

      - name: Package
        run: nix develop --command just package ${{ matrix.arch }} Release
        env:
          # macOS: the self-signed certificate from `just mac-signing-setup` (ad hoc without it)
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: ${{ matrix.package }}

  # Its own job: there is no nix on Windows, so `just` sets up .sdk through scripts/windows-env.sh.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # `just package` derives the version from `git describe --tags`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: |
            .conan2
            .sdk
          key: quickrecord-windows-x64-${{ hashFiles('flake.nix', 'conanfile.py', 'conan-profiles/conan-windows-x64-clang', 'scripts/windows-env.sh') }}
          restore-keys: quickrecord-windows-x64-

      - name: Tools
        run: pip install aqtinstall conan cmake ninja rust-just

      - name: Tests
        run: just tests windows-x64 Release

      - name: Package
        run: just package windows-x64 Release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: QuickRecord-*-windows-x64.zip

      # After the upload: the zip still ships if this runner can't record, and the job shows red.
      - name: Record with the packaged app
        run: bash scripts/windows-smoke.sh

  release:
    needs: [build, build-windows]
    if: ${{ !cancelled() }} # publish whatever built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: QuickRecord ${{ env.TAG }}
          fail_on_unmatched_files: false
          files: |
            QuickRecord-*-x86_64.AppImage
            QuickRecord-*-macos-arm64.dmg
            QuickRecord-*-windows-x64.zip
